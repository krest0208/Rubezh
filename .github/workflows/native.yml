name: Native CSharp
on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover original data and verify generated models
        run: |
          node tools/extract_native_data.mjs
          node tools/build_models.mjs
          git diff --exit-code -- native/Game/Data native/Game/Art docs/models.svg
      - name: Run domain integration tests
        run: dotnet run --project native/Tests --configuration Release -- native/Game/Data
      - name: Build Godot CSharp project
        run: dotnet build native/Game/Rubezh.csproj --configuration Debug
      - name: Install pinned Godot .NET
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "/tmp/godot/Godot_v4.5.1-stable_mono_linux_x86_64" >> "$GITHUB_PATH"
      - name: Import project and smoke test all screens
        run: |
          Godot_v4.5.1-stable_mono_linux.x86_64 --headless --path native/Game --editor --import
          Godot_v4.5.1-stable_mono_linux.x86_64 --headless --path native/Game -- --smoke-test 2>&1 | tee /tmp/smoke.log
          grep -q GODOT_SMOKE_OK /tmp/smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/smoke.log; then exit 1; fi
      - name: Capture real engine screens
        run: |
          mkdir -p captures
          xvfb-run -a Godot_v4.5.1-stable_mono_linux.x86_64 --audio-driver Dummy --path native/Game -- --capture "$PWD/captures/menu.png"
          xvfb-run -a Godot_v4.5.1-stable_mono_linux.x86_64 --audio-driver Dummy --path native/Game -- --armory --capture "$PWD/captures/armory.png"
          xvfb-run -a Godot_v4.5.1-stable_mono_linux.x86_64 --audio-driver Dummy --path native/Game -- --battle --capture "$PWD/captures/battle.png"
      - uses: actions/upload-artifact@v4
        with:
          name: rubezh-engine-screens
          path: captures/
      - name: Package source project
        run: git archive --format=zip --output=rubezh-csharp-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: rubezh-csharp-source
          path: rubezh-csharp-source.zip
