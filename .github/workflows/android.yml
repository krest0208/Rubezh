name: Android APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'
      - name: Install Godot .NET and Android templates
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo '/tmp/godot/Godot_v4.5.1-stable_mono_linux_x86_64' >> "$GITHUB_PATH"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_export_templates.tpz -o /tmp/godot-templates.tpz
          python tools/setup_android_export.py
      - name: Build and export signed preview APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/rubezh-preview.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          keytool -genkeypair -keystore /tmp/rubezh-preview.keystore -alias androiddebugkey -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          dotnet build native/Game/Rubezh.csproj --configuration Debug
          Godot_v4.5.1-stable_mono_linux.x86_64 --headless --path native/Game --editor --import
          mkdir -p native/Game/exports/android
          Godot_v4.5.1-stable_mono_linux.x86_64 --headless --path native/Game --export-debug Android 2>&1 | tee /tmp/android-export.log
          test -s native/Game/exports/android/Rubezh-0.1.0-preview.apk
          python tools/check_android_apk.py native/Game/exports/android/Rubezh-0.1.0-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose native/Game/exports/android/Rubezh-0.1.0-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging native/Game/exports/android/Rubezh-0.1.0-preview.apk
          sha256sum native/Game/exports/android/Rubezh-0.1.0-preview.apk > native/Game/exports/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rubezh-android-apk
          path: native/Game/exports/android/
          compression-level: 0
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1280x800 -memory 4096
          script: python tools/smoke_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rubezh-android-check
          path: android-check/
